<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1529">
<title>PuzzleVision Cam</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#1c1529; --panel:rgba(28,21,41,.86); --ink:#f4effa; --muted:#b3a6c9; --accent:#e8486f; --accent2:#46c9c4; --line:rgba(255,255,255,.12); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  html.transparent, html.transparent body { background:transparent; }
  html.clean .bar, html.clean #hud, html.clean #settings, html.clean #feed { display:none !important; }
  .row.poses { gap:6px; flex-wrap:nowrap; justify-content:center; }
  .row.poses button { display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 8px; min-width:50px; font-size:11px; line-height:1.1; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .row.poses button .i { font-size:20px; line-height:1.15; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s ease-out; }
  #flash.on { opacity:.85; transition:none; }
  #stage { position:fixed; inset:0; width:100vw; height:100dvh; display:block; touch-action:none; }
  #hud { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; font-size:12px; color:var(--muted); text-align:right; text-shadow:0 1px 2px #000; }
  #status, #toast { position:fixed; left:50%; transform:translateX(-50%); background:var(--panel); padding:8px 14px; border-radius:20px; border:1px solid var(--line); font-size:14px; max-width:90vw; text-align:center; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #status { top:42%; } #toast { bottom:calc(env(safe-area-inset-bottom) + 140px); }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 10px calc(env(safe-area-inset-bottom) + 10px); background:linear-gradient(transparent, rgba(16,11,26,.92) 30%); }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  button, select { font:inherit; color:var(--ink); background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-height:44px; }
  button.on { background:var(--accent); border-color:transparent; }
  .seg { display:flex; background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:transparent; }
  .seg button.on { background:var(--accent2); color:#102020; font-weight:600; }
  #btn-cam { min-width:84px; font-weight:600; background:var(--accent2); color:#102020; }
  #btn-cam.on { background:var(--accent); color:#fff; }
  #btn-rec.on { background:#d22; }
  #btn-mic { --lvl:0%; }
  .row.main { gap:6px; flex-wrap:nowrap; } .row.main button { padding:10px 11px; white-space:nowrap; } .row.main #btn-cam { min-width:70px; }
  @media (max-width:380px) { .row.main { gap:5px; } .row.main button { padding:10px 8px; font-size:14px; } .row.main #btn-cam { min-width:0; }
    .row.poses { gap:4px; } .row.poses button { min-width:44px; padding:5px 3px; font-size:10px; } }
  #btn-mic.on { background:linear-gradient(to top, var(--accent2) var(--lvl), var(--accent) var(--lvl)); border-color:transparent; }
  #empty { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px; }
  #empty .card { max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; }
  #empty h1 { font-size:22px; margin:0 0 8px; } #empty p { color:var(--muted); margin:0 0 16px; }
  .fine { font-size:12px; color:var(--muted); }
  [hidden] { display:none !important; }

  /* camera preview / "what the tracker sees" */
  #feed { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:10px; width:28vw; max-width:180px; border-radius:12px; overflow:hidden; border:1px solid var(--line); box-shadow:0 6px 20px rgba(0,0,0,.4); background:#0b0812; cursor:pointer; transition:width .2s, max-width .2s; }
  #feed.large { width:46vw; max-width:420px; }
  #feed video { width:100%; display:block; }
  #feed canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #feed.tracking video { opacity:0; }
  #feed.mirror video, #feed.mirror canvas { transform:scaleX(-1); }
  #feed:not(.large) #feedtag { display:none; }
  #feedtag { position:absolute; left:6px; bottom:5px; font-size:10px; color:#fff; background:rgba(0,0,0,.45); padding:1px 6px; border-radius:8px; pointer-events:none; }
  /* settings: bottom sheet on phones, side panel on wide screens */
  #settings { position:fixed; left:0; right:0; bottom:0; height:min(68dvh, 640px); display:flex; flex-direction:column; background:rgba(22,16,33,.94); border-top:1px solid var(--line); border-radius:20px 20px 0 0; box-shadow:0 -12px 40px rgba(0,0,0,.45); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:20; padding-bottom:env(safe-area-inset-bottom); }
  @media (min-width:760px) { #settings { left:auto; top:0; width:400px; height:auto; border-radius:0; border-top:0; border-left:1px solid var(--line); } }
  .set-head { display:flex; align-items:center; gap:10px; padding:10px 14px 4px; position:relative; }
  .set-head h2 { margin:6px 0 0; font-size:18px; flex:1; }
  .set-grip { position:absolute; left:50%; top:6px; width:40px; height:4px; margin-left:-20px; border-radius:2px; background:rgba(255,255,255,.25); }
  @media (min-width:760px) { .set-grip { display:none; } }
  .set-close { min-height:36px; width:36px; padding:0; border-radius:50%; }
  .set-tabs { display:flex; gap:4px; padding:6px 10px 8px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); }
  .set-tabs::-webkit-scrollbar { display:none; }
  .set-tab { display:flex; flex-direction:column; align-items:center; gap:2px; min-height:0; padding:6px 10px; border:0; background:transparent; border-radius:10px; font-size:11px; color:var(--muted); flex:0 0 auto; }
  .set-tab .ti { font-size:18px; line-height:1.1; filter:grayscale(.6); }
  .set-tab.on { background:rgba(70,201,196,.16); color:var(--ink); }
  .set-tab.on .ti { filter:none; }
  .set-body { flex:1; overflow-y:auto; padding:10px 12px 18px; overscroll-behavior:contain; }
  .set-card { background:rgba(255,255,255,.045); border:1px solid var(--line); border-radius:14px; padding:4px 12px; margin-bottom:12px; }
  .set-card h3 { margin:10px 0 2px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .set-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid rgba(255,255,255,.06); }
  .set-card h3 + .set-row, .set-card > .set-row:first-child { border-top:0; }
  .set-row[hidden] { display:none; }
  .set-text { flex:1; min-width:0; }
  .set-label { font-size:15px; }
  .set-desc { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.3; }
  .set-slider { flex-direction:column; align-items:stretch; gap:6px; }
  .set-sl-top { display:flex; align-items:flex-start; gap:10px; }
  .set-val { font-variant-numeric:tabular-nums; font-size:13px; color:var(--accent2); min-width:44px; text-align:right; padding-top:1px; }
  .set-slider input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:0; }
  .set-slider input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(to right, var(--accent2) var(--p,50%), rgba(255,255,255,.14) var(--p,50%)); }
  .set-slider input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:linear-gradient(to right, var(--accent2) var(--p,50%), rgba(255,255,255,.14) var(--p,50%)); }
  .set-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; margin-top:-8px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .set-slider input[type=range]::-moz-range-thumb { width:22px; height:22px; border:0; border-radius:50%; background:#fff; }
  .switch { position:relative; flex:0 0 auto; width:50px; height:30px; }
  .switch input { position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch .knob { position:absolute; inset:0; border-radius:15px; background:rgba(255,255,255,.18); transition:background .15s; pointer-events:none; }
  .switch .knob::after { content:''; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .switch input:checked + .knob { background:var(--accent2); }
  .switch input:checked + .knob::after { transform:translateX(20px); }
  .switch input:focus-visible + .knob { outline:2px solid #fff; outline-offset:2px; }
  .segctl { display:flex; flex:0 0 auto; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .segctl button { border:0; border-radius:0; background:transparent; min-height:34px; padding:6px 10px; font-size:13px; }
  .segctl button.on { background:var(--accent2); color:#102020; font-weight:600; }
  .set-swatch { flex-wrap:wrap; }
  .set-swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .swatch { width:34px; height:34px; min-height:0; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.25); }
  .swatch.on { border-color:#fff; box-shadow:0 0 0 2px var(--accent2); }
  .swatch.clear { background:repeating-conic-gradient(#888 0 25%, #ddd 0 50%) 50% / 12px 12px; }
  .set-swatch .set-desc { flex-basis:100%; }
  .set-btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .set-btns button { min-height:38px; padding:8px 12px; font-size:14px; }
  .set-btns button.primary { background:var(--accent2); color:#102020; font-weight:600; border-color:transparent; }
  .set-btns button.danger { color:#ff9aa8; }
  .set-buttons { flex-wrap:wrap; }
  .set-note .set-desc { font-size:12.5px; }
  .set-live { width:100%; font-size:13px; line-height:1.55; font-variant-numeric:tabular-nums; }
  .set-row.set-live { flex-direction:column; align-items:stretch; }
  .set-live .k { color:var(--muted); } .set-live .ok { color:var(--accent2); } .set-live .bad { color:#ff8fa3; } .set-live .warn { color:#ffd166; }
  .set-live table { width:100%; border-collapse:collapse; } .set-live td { padding:2px 0; vertical-align:top; } .set-live td:last-child { text-align:right; }
  .set-row.stack { flex-direction:column; align-items:stretch; gap:8px; }
  .set-row.stack .segctl { width:100%; }
  .set-row.stack .segctl button { flex:1; padding:6px 4px; }
  .set-row.stack .set-btns { justify-content:flex-start; }
  .set-row.stack .set-btns button { flex:1 1 auto; }

  /* intro (PuzzleVision / ZAMination style): CRT switches on, the logo flickers in, the line types out;
     the app appears once the avatar is ready (at least ~3 s). Real loading status shows only if slow. */
  #boot { position:fixed; inset:0; z-index:50; background:#000; display:grid; place-items:center; overflow:hidden; cursor:default; }
  #boot .crt { position:absolute; inset:0; display:grid; place-items:center; transform-origin:50% 50%; animation:crt-on .55s cubic-bezier(.2,.8,.3,1) .2s both; }
  #boot .crt::after { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
  @keyframes crt-on { 0% { transform:scale(1, .004); filter:brightness(6); } 55% { transform:scale(1, .004); filter:brightness(6); } 100% { transform:scale(1, 1); filter:brightness(1); } }
  #boot .stack { display:flex; flex-direction:column; align-items:center; gap:clamp(18px, 4vh, 34px); }
  #boot .logo { width:clamp(110px, 28vw, 170px); height:auto; opacity:0; animation:logo-in .55s steps(1, end) .75s forwards; filter:drop-shadow(0 0 10px rgba(255,255,255,.18)); }
  @keyframes logo-in { 0% { opacity:.0; } 15% { opacity:.8; } 25% { opacity:.1; } 40% { opacity:1; } 55% { opacity:.35; } 70%, 100% { opacity:1; } }
  /* typing with transform animations only (they keep running while the page is busy building the avatar):
     a black shutter slides off the text one character at a time, the cursor rides along */
  #boot .line { position:relative; overflow:hidden; font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:clamp(17px, 5.2vw, 26px); letter-spacing:.12em; color:#f2f2f2; white-space:pre; line-height:1.4; padding-right:1.2ch; text-shadow:0 0 6px rgba(255,255,255,.25); }
  #boot .line .shutter { position:absolute; inset:0; background:#000; animation:type 1.5s steps(23, end) 1.25s forwards; }
  #boot .line .cur { position:absolute; left:0; bottom:.18em; width:calc(1ch + .12em); height:2px; background:#f2f2f2; animation:cur-move 1.5s steps(23, end) 1.25s forwards, blink 1s steps(1) 2.8s infinite; }
  @keyframes type { to { transform:translateX(100%); } }
  @keyframes cur-move { to { transform:translateX(2300%); } }
  @keyframes blink { 50% { opacity:0; } }
  #boot .status { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 28px); text-align:center; font:12px/1.6 ui-monospace, monospace; letter-spacing:.08em; color:#8a8a8a; text-transform:uppercase; opacity:0; transition:opacity .4s; }
  #boot.slow .status { opacity:1; }
  #boot .status ul { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; justify-content:center; gap:4px 16px; }
  #boot .status li { display:inline; } #boot .status li b { font-weight:400; color:#bdbdbd; } #boot .status li span::before { content:' '; }
  #boot .status li.ready span { color:#46c9c4; } #boot .status li.failed span { color:#ff8fa3; } #boot .status li.later { display:none; }
  #boot .note { margin-top:6px; text-transform:none; letter-spacing:0; }
  #boot.off .crt { animation:crt-off .42s cubic-bezier(.6,0,.9,.4) forwards; }
  #boot.off { transition:background .2s .3s; background:transparent; }
  @keyframes crt-off { 0% { transform:scale(1, 1); filter:brightness(1); } 60% { transform:scale(1, .006); filter:brightness(5); } 100% { transform:scale(0, .006); filter:brightness(8); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { #boot .crt, #boot .logo, #boot .line .shutter, #boot .line .cur { animation:none; opacity:1; } #boot .line .shutter { display:none; } #boot.off { opacity:0; transition:opacity .3s; } #boot.off .crt { animation:none; } }
  #chip { position:fixed; top:calc(env(safe-area-inset-top) + 30px); right:12px; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px 10px; color:var(--muted); transition:opacity .4s; }
  #chip.done { opacity:0; }
  html.clean #chip { display:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.138.3/build/three.module.js",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.138.3/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.module.js",
  "kalidokit": "https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.es.js",
  "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
} }
</script>

<body>
<div id="boot" role="status" aria-label="PuzzleVision is starting">
  <div class="crt">
    <div class="stack">
      <img class="logo" src="assets/logo.png" alt="PuzzleVision" width="238" height="313">
      <div class="line" id="bootline" aria-label="You've finally arrived."><span class="txt">YOU’VE FINALLY ARRIVED.</span><span class="shutter"></span><span class="cur"></span></div>
    </div>
  </div>
  <div class="status">
    <ul>
      <li data-k="avatar"><b>Avatar</b><span>starting…</span></li>
      <li data-k="face"><b>Face</b><span>waiting</span></li>
      <li data-k="pose"><b>Body</b><span>waiting</span></li>
      <li data-k="hand"><b>Hands</b><span>waiting</span></li>
    </ul>
    <div class="note" id="bootnote"></div>
  </div>
</div>
<div id="chip" class="done" hidden></div>
<script>
  // intro: types the line, enforces a minimum time, lets a tap skip once the app is ready.
  // window.__intro.done() is called by the app when the avatar is ready (main.js bootDone).
  (function () {
    var boot = document.getElementById('boot'), note = document.getElementById('bootnote');
    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var MIN = reduced ? 1200 : 3400, t0 = performance.now();      // the typing ends at ~2.75 s, then a short hold
    var ready = false, gone = false;
    function exit() {
      if (gone || !boot.isConnected) return; gone = true;
      boot.classList.add('off'); setTimeout(function () { boot.remove(); }, 480);
    }
    window.__intro = {
      done: function (immediate) {
        ready = true;
        if (immediate) { gone = true; boot.remove(); return; }
        setTimeout(exit, Math.max(0, MIN - (performance.now() - t0)));
      },
    };
    boot.addEventListener('click', function () { if (ready) exit(); });
    // still loading after the intro: show the real status
    setTimeout(function () { if (!ready && boot.isConnected) boot.classList.add('slow'); }, MIN);
    // safety net: the intro must never trap anyone (script error, very slow network)
    function offer(msg, label, act) {
      if (!boot.isConnected) return;
      boot.classList.add('slow');
      note.innerHTML = msg + ' <button id="bootbtn" style="min-height:30px;padding:3px 10px;margin-left:6px;font:inherit">' + label + '</button>';
      document.getElementById('bootbtn').onclick = function (e) { e.stopPropagation(); act(); };
    }
    window.addEventListener('error', function (e) { offer('Something went wrong (' + String(e.message || 'error').slice(0, 80) + ').', 'Reload', function () { location.reload(); }); });
    setTimeout(function () { offer('This is taking long (slow connection?).', 'Continue anyway', function () { exit(); }); }, 25000);
  })();
</script>

  </div>

    <button id="btn-cam">Start</button>

    <button id="btn-photo" aria-label="Take a photo">📷</button>
    <button id="btn-set">⚙︎</button>
  </div>
</div>
